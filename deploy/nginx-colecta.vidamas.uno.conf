# /etc/nginx/sites-available/colecta.vidamas.uno
# Sitio estático LLAMANDO 2026. Raíz: /var/www/colecta.vidamas.uno (contenido de dist/).
# El bloque 443 lo completa certbot (ver deploy/DEPLOY.md). Hasta entonces funciona en :80.

server {
    listen 80;
    listen [::]:80;
    server_name colecta.vidamas.uno;

    root /var/www/colecta.vidamas.uno;
    index index.html;
    charset utf-8;

    # Compresión (gzip viene en nginx de Ubuntu; brotli requiere módulo aparte)
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml application/xml application/json application/manifest+json
               application/javascript text/javascript image/svg+xml image/x-icon;

    types {
        image/avif avif;
        application/manifest+json webmanifest;
    }

    # Cabeceras de seguridad (Lighthouse › Best Practices)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Assets con hash en el nombre: caché inmutable 1 año
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # Iconos, OG, manifest: nombre estable → caché corta
    location ~* \.(?:ico|png|svg|jpg|webmanifest)$ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # HTML siempre revalidado para que los cambios se vean al instante
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
