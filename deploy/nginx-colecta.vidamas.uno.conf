# ============================================================
# colecta.vidamas.uno — LLAMANDO 2026 · Colecta Navideña Vida Máxima
# Sitio estático: contenido de dist/ en /var/www/colecta.vidamas.uno/html
# Cert: certbot certonly --webroot (renovación por certbot.timer)
# ============================================================

# http → https. El acme-challenge se sirve por http para que la renovación por webroot funcione.
server {
    listen 80;
    listen [::]:80;
    server_name colecta.vidamas.uno;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/colecta.vidamas.uno/html;
        default_type text/plain;
    }

    location / {
        return 301 https://colecta.vidamas.uno$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name colecta.vidamas.uno;

    root  /var/www/colecta.vidamas.uno/html;
    index index.html;
    charset utf-8;

    # --- TLS (Let's Encrypt) ---
    ssl_certificate     /etc/letsencrypt/live/colecta.vidamas.uno/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/colecta.vidamas.uno/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # --- Compresión (gzip on ya viene del http{}; aquí se amplían los tipos) ---
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml application/xml application/json application/manifest+json
               application/javascript text/javascript image/svg+xml image/x-icon;

    # --- Cabeceras de seguridad ---
    # add_header no se hereda si un location define los suyos: por eso se repiten vía snippet inline.
    set $hsts "max-age=31536000";
    add_header Strict-Transport-Security $hsts always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Assets con hash de contenido en el nombre → caché inmutable 1 año
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security $hsts always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # mime.types de Ubuntu no trae .webmanifest (no se redefine types{} para no perder la tabla global)
    location = /site.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=604800" always;
        add_header Strict-Transport-Security $hsts always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Iconos y OG: nombre estable → caché de 7 días
    location ~* \.(?:ico|png|svg|jpg)$ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header Strict-Transport-Security $hsts always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # HTML siempre revalidado: los cambios se ven al instante
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security $hsts always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # .htaccess es solo para Apache
    location ~ /\.ht { deny all; }
}
